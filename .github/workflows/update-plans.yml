name: Aktualizuj plany lekcji

on:
  schedule:
    # Nowy plan i pusty zestaw zmian na tydzień od poniedziałku.
    - cron: "0 20 * * 0"
      timezone: "Europe/Warsaw"
    # Zmiany bieżącego tygodnia od poniedziałku do piątku.
    - cron: "0 20 * * 1-5"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zainstaluj zależności
        run: pip install -r requirements.txt
      - name: Odśwież zmiany bieżącego tygodnia
        if: github.event_name == 'schedule' && github.event.schedule == '0 20 * * 1-5'
        run: python scripts/import_plans.py --changes-only
      - name: Rozpocznij tydzień i pobierz plan
        if: github.event_name != 'schedule' || github.event.schedule == '0 20 * * 0'
        run: python scripts/import_plans.py
      - name: Zapisz zmienioną bazę
        run: |
          if [[ -n "$(git status --porcelain data/lessons.json)" ]]; then
            git config user.name "teacher-finder-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/lessons.json
            git commit -m "Aktualizacja planów lekcji"
            git push
          else
            echo "Brak zmian w planach."
          fi
